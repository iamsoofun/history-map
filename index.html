<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E1116">
  <title>NHIRA — National Historical Incident Research &amp; Analysis</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header id="topbar">
    <div class="brand">
      <span class="shield" aria-hidden="true">🛡️</span>
      <div class="brand-text">
        <h1>NHIRA</h1>
        <p class="subtitle">National Historical Incident Research &amp; Analysis</p>
      </div>
    </div>

    <div class="search-wrap">
      <input id="search" type="search" placeholder="Search incidents" autocomplete="off">
    </div>

    <button id="forecastToggle" class="stats-toggle" aria-label="Open incident forecast" aria-expanded="false" aria-controls="forecastPanel">
      🔮 <span class="stats-toggle-word">Forecast</span>
    </button>

    <button id="statsToggle" class="stats-toggle" aria-label="Open research and statistics" aria-expanded="false" aria-controls="statsPanel">
      📊 <span class="stats-toggle-word">Stats</span>
    </button>
  </header>

  <main id="stage">
    <div id="map"></div>

    <div id="mapModeControl" class="map-mode-control" role="group" aria-label="Map mode">
      <button type="button" class="map-mode-btn active" data-mode="observed">Observed</button>
      <button type="button" class="map-mode-btn" data-mode="context">Context</button>
      <button type="button" class="map-mode-btn" data-mode="forecast">Forecast</button>
    </div>

    <div id="legend" class="collapsed">
      <button id="legendToggle" aria-expanded="false" aria-controls="legendList">
        <span class="legend-icon" aria-hidden="true">◈</span>
        <span class="legend-word">Legend</span>
      </button>
      <ul id="legendList"></ul>
    </div>

    <div id="dateRangeResearch" class="date-range-research">
      <div class="range-title">Historical Research Range</div>

      <div class="range-inputs">
        <label>
          From
          <input id="startYear" type="number" min="1900" max="2100" value="1900">
        </label>

        <label>
          To
          <input id="endYear" type="number" min="1900" max="2100" value="2100">
        </label>

        <button id="rangeSearchBtn" type="button">Search Range</button>
        <button id="clearRangeBtn" type="button">Clear</button>
      </div>

      <div id="rangeResults" class="range-results"></div>
    </div>
  </main>

  <div id="timebar">
    <div class="timebar-row">
      <button id="playBtn" class="transport" aria-label="Play timeline">▶</button>
      <button id="pauseBtn" class="transport" aria-label="Pause
