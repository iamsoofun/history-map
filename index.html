<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NHIRA</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>

<body>

    <div id="map"></div>
<div id="sidePanel">
    <button id="closePanel">✕</button>

    <div id="panelContent">
        <h2>Select an Incident</h2>
        <p>Click a marker on the map to view details.</p>
    </div>
</div>
    <header>

        <h1>🛡️ NHIRA</h1>

        <p class="subtitle">
            National Historical Incident Research & Analysis
        </p>

        <input
            id="search"
            type="text"
            placeholder="Search incidents..."
        >

    </header>

    <div id="controls">

        <button id="playBtn">▶ Play</button>

        <button id="pauseBtn">⏸ Pause</button>

        <span id="yearDisplay">Year: -3000</span>

    </div>

    <input
        id="timeline"
        type="range"
        min="-3000"
        max="2026"
        value="-3000"
    ><div id="sidePanel">
    <button id="closePanel">✕</button>

    <div id="panelContent">
        <h2>Select an Incident</h2>
        <p>Click a marker on the map to view details.</p>
    </div>
</div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script src="script.js"></script>

</body>

</html>
